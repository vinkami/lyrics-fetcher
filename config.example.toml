# lyrics-fetcher configuration
# Copy this to ~/.config/lyrics-fetcher/config.toml (or ./config.toml) and edit.
#
# Precedence: CLI arguments > environment > this file > built-in defaults.
# Environment: LYRICS_FETCHER_<SECTION>_<KEY> (e.g. LYRICS_FETCHER_VISION_VISION_API),
# plus the alias VISION_API_KEY. A gitignored .env in the working dir or
# ~/.config/lyrics-fetcher/.env is loaded into the environment automatically
# (python-dotenv; real exported vars win).
#
# NEVER put API keys in this file if you might commit it — keys belong in .env
# (gitignored). All paths are optional — omit any key to use the default.

[paths]
# Where your music library lives (base for batch operations)
music_dir = "/path/to/your/Music"
# SQLite cache location (lyrics + OCR); default ~/.cache/lyrics-fetcher/cache.db
#cache_db = "/home/you/.cache/lyrics-fetcher/cache.db"
# default output directory (used by `full`/`album` without --jellyfin)
out_dir = "out"

[whisper]
# whisper.cpp binary + model (primary aligner); defaults are
# ~/whisper.cpp/build/bin/whisper-cli and ~/whisper.cpp/models/ggml-medium.bin
#whisper_bin = "/home/you/whisper.cpp/build/bin/whisper-cli"
#whisper_model = "/home/you/whisper.cpp/models/ggml-medium.bin"
# extra model(s) merged as anchors (list or comma-separated); empty = none
#whisper_extra_models = "/home/you/whisper.cpp/models/ggml-large-v3-turbo.bin"
whisper_lang = "ja"
whisper_max_len = 40
whisper_device = 0

[vision]
# Booklet OCR: ANY OpenAI-compatible endpoint with vision. Give the *base URL*
# (ends at /v1); the code appends the fixed /chat/completions path.
# Local llama-server (default):
vision_api = "http://127.0.0.1:8081/v1"
vision_model = "qwen3.5-9b"
# Cloud examples (key goes in .env as VISION_API_KEY, NOT here):
#vision_api = "https://openrouter.ai/api/v1"
#vision_api = "https://api.openai.com/v1"
#vision_model = "gpt-4o"
# You may set the key here for a private config, but prefer VISION_API_KEY:
#vision_api_key = ""

[qwen3_aligner]
# Qwen3-ForcedAligner model dir (the --aligner qwen3 option)
#qwen3_aligner_model = "/path/to/qwen3-forcedaligner/model"
qwen3_aligner_language = "Japanese"

[stable_ts]
# stable-ts forced alignment (the --aligner stable-ts option; a dev extra,
# needs `uv sync --dev`). whisper model size used by stable_whisper.load_model
stable_ts_model = "medium"
stable_ts_lang = "ja"
# torch device: "cuda" = your primary GPU (NVIDIA or AMD/ROCm — both
# present as cuda). "cpu" works but is slow; "cuda:1" picks another card.
stable_ts_device = "cuda"

[output]
lrc_by = "lyrics-fetcher"
# default to Jellyfin layout (write .lrc next to audio) when not given on CLI
jellyfin_default = false
write_html_default = true

[tuning]
# minimum fuzzy-match score for a whisper segment to be treated as a time anchor
anchor_min_score = 58.0
# HTTP timeout for web fetchers/vision, seconds
request_timeout = 20
