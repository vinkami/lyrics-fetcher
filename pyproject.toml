[project]
name = "lyrics-fetcher"
version = "0.1.0"
description = "Fetch, align, and write lyrics files for music."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faster-whisper>=1.2.1",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "thefuzz>=0.22.1",
]

[project.scripts]
lyrics-fetcher = "lyrics_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyrics_fetcher"]

[tool.uv]
package = true
